<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>world/ocean - GPU FFT debug</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05141a; color: #d6e6e1; overflow: hidden;
        font: 12px/1.35 ui-monospace, Consolas, monospace; }
      #view { position: fixed; inset: 0; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #panel { position: fixed; top: 8px; right: 8px; max-width: 46vw; max-height: 96vh; overflow: auto;
        background: #071d24e6; border: 1px solid #2b4b52; border-radius: 6px; padding: 8px 10px; white-space: pre; }
      #panel button, #panel select { background: #0d2c35; color: inherit; border: 1px solid #2b4b52; border-radius: 4px;
        padding: 2px 7px; font: inherit; cursor: pointer; }
      .labels { position: fixed; inset: 0; pointer-events: none; }
      .labels div { position: absolute; color: #fff; text-shadow: 0 0 3px #000; padding: 2px 4px; }
    </style>
  </head>
  <body>
    <main id="view"></main>
    <div class="labels" id="labels"></div>
    <section id="panel">
      <div>
        tier <select id="tier"><option>low</option><option>medium</option><option>high</option><option>ultra</option></select>
        lod <select id="lod"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
        <button id="check" type="button">run GPU-vs-CPU check</button>
      </div>
      <div id="stats">starting...</div>
      <div id="results"></div>
    </section>
    <script type="module" src="./fft-debug.ts"></script>
  </body>
</html>
